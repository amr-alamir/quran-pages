    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="description" content="المصحف الإلكتروني — قراءة القرآن الكريم">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff">
    <script>
      (() => {
        let nightModeEnabled = false;
        try {
          const settings = JSON.parse(localStorage.getItem('quran-settings') || 'null');
          nightModeEnabled = Boolean(settings && settings.nightMode);
        } catch {
          // Invalid persisted settings fall back to the light theme.
        }

        const theme = nightModeEnabled ? 'night' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = nightModeEnabled ? 'dark' : 'light';
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', nightModeEnabled ? '#121212' : '#ffffff');
      })();
    </script>
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #fff;
        color: #222;
        opacity: 1;
        transition: opacity 220ms ease;
      }

      html[data-theme='night'] #app-splash {
        background: #121212;
        color: #eee;
      }

      #app-splash.app-splash-leaving {
        opacity: 0;
        pointer-events: none;
      }

      .app-splash-content {
        display: grid;
        place-items: center;
        gap: 14px;
        transform: translateY(-3vh);
      }

      .app-splash-icon {
        width: 76px;
        height: 76px;
        color: #7a6747;
      }

      html[data-theme='night'] .app-splash-icon {
        color: #c7ad7d;
      }

      .app-splash-title {
        font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
        font-size: 1.05rem;
        font-weight: 500;
      }

      .app-splash-spinner {
        width: 22px;
        height: 22px;
        margin-top: 4px;
        border: 2px solid currentColor;
        border-inline-start-color: transparent;
        border-radius: 50%;
        opacity: 0.48;
        animation: app-splash-spin 800ms linear infinite;
      }

      @keyframes app-splash-spin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-splash { transition: none; }
        .app-splash-spinner { animation: none; }
      }
    </style>
